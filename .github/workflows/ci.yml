name: CI

on:
  pull_request:
  push:
    branches:
      - "claude/keen-franklin-hYlvl"

env:
  # Corepack downloads the pnpm version pinned in package.json's
  # "packageManager" field; never prompt for confirmation in CI.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  ci:
    name: typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Enable corepack (pnpm from packageManager field)
        run: corepack enable

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
